<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SwimStopwatch">
<title>SwimStopwatch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0;
         padding: 0 16px calc(24px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  .header-sticky { position: sticky; top: 0; z-index: 10; background: #0f172a; margin: 0 -16px; padding: calc(14px + env(safe-area-inset-top)) 16px 0; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  h2 { font-size: 15px; margin: 24px 0 10px; color: #cbd5e1; }
  .sub { color: #94a3b8; font-size: 12px; margin-bottom: 12px; }

  #menuBtn { min-height: 40px; min-width: 44px; padding: 6px; font-size: 20px; line-height: 1; flex-shrink: 0; }
  #menuBtn.open { background: #3b82f6; }
  #sessionBadge { max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu .card { margin-bottom: 12px; border: 1px solid #334155; }

  .tabs { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid #334155; }
  .tab-btn { flex: 1; background: none; color: #94a3b8; padding: 12px 4px; border-bottom: 2px solid transparent; border-radius: 0; }
  .tab-btn.active { color: #e2e8f0; border-bottom-color: #3b82f6; }

  button { background: #3b82f6; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; min-height: 44px; font-family: inherit; }
  button { transition: transform 0.08s, filter 0.08s; }
  button:active { filter: brightness(1.25); transform: scale(0.96); }
  button.secondary { background: #475569; }
  button.danger { background: #dc2626; }
  button.small { min-height: 36px; padding: 6px 10px; font-size: 13px; }

  input[type=text] { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 16px; width: 100%; min-width: 0; font-family: inherit; }
  input[type=checkbox] { width: 22px; height: 22px; flex-shrink: 0; }

  .card { background: #1e293b; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
  .flex { display: flex; align-items: center; gap: 10px; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .label { font-size: 12px; color: #94a3b8; }
  .strong { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .btnrow { display: flex; gap: 10px; margin-bottom: 12px; }
  .btnrow > button { flex: 1; }

  /* Extra room below the group buttons so the horizontal scroll bar sits
     under them instead of across the names. */
  .chips { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 8px; padding-bottom: 16px; }
  .chip { background: #334155; white-space: nowrap; flex-shrink: 0; min-height: 44px; padding: 8px 16px; font-size: 14px; border-radius: 22px;
          border: 1px solid transparent; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
  .chip:active { background: #475569; transform: scale(0.96); filter: none; }
  .chip.active { background: #1e3a8a; border-color: #3b82f6; }

  /* Swimmer list shows 4 rows (64px each + 10px gaps), the rest scrolls. */
  #swimmerList { max-height: 286px; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px; }
  #swimmerList .card { min-height: 64px; }
  #swimmerList .card:last-child { margin-bottom: 0; }
  #groupList { overflow-y: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px; }
  #groupList .card:last-child { margin-bottom: 0; }

  /* Enlarged tap area around a tick box inside a tappable row */
  .tick { display: flex; align-items: center; padding: 12px; margin: -12px -2px -12px -12px; }

  /* Stopwatch rows - the whole card is the tap target */
  .lap { user-select: none; -webkit-user-select: none; border: 1px solid transparent; }
  .lap.running { background: #14532d; border-color: #22c55e; }
  .time { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  /* The two per-swimmer buttons: equal width, big enough to hit poolside */
  .swimbtns { display: flex; gap: 10px; margin-top: 10px; }
  .swimbtns > button { flex: 1 1 0; min-height: 56px; font-size: 17px; font-weight: 600; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:active { filter: none; transform: none; }
  /* Confirmation after a tap registered: a bright ring that fades out */
  @keyframes tapflash {
    from { box-shadow: 0 0 0 4px #e2e8f0; filter: brightness(1.7); }
    to   { box-shadow: 0 0 0 0 transparent; filter: none; }
  }
  .flash { animation: tapflash 0.5s ease-out; }

  .bar { flex: 1; background: #0f172a; border-radius: 4px; overflow: hidden; height: 18px; }
  .bar > div { height: 100%; background: #3b82f6; }
  .bar > div.best { background: #22c55e; }
  .x { background: none; color: #94a3b8; min-height: 32px; width: 30px; padding: 0; font-size: 18px; flex-shrink: 0; }

  /* Stopwatch tab: start/stop buttons pinned to the bottom of the screen.
     The tab gets matching bottom padding so the last swimmer row can scroll
     clear of the bar. */
  #tab-watch { padding-bottom: 80px; }
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #0f172a; border-top: 1px solid #334155;
               padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bottombar > :last-child { margin-bottom: 0; }

  #toast { position: fixed; left: 16px; right: 16px; top: calc(16px + env(safe-area-inset-top)); background: #334155; color: #e2e8f0;
           padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; z-index: 20; }
</style>
</head>
<body>
<div class="header-sticky">
  <div class="flex" style="margin-bottom:6px;">
    <h1 class="grow" style="margin:0;">SwimStopwatch</h1>
    <div class="label" id="sessionBadge"></div>
    <button class="secondary" id="menuBtn" onclick="toggleMenu()" aria-label="Menu">☰</button>
  </div>
  <div id="menu" hidden></div>
  <div class="tabs">
    <button class="tab-btn" id="tabbtn-watch" onclick="showTab('watch')">Stopwatch</button>
    <button class="tab-btn" id="tabbtn-swimmers" onclick="showTab('swimmers')">Swimmers</button>
    <button class="tab-btn" id="tabbtn-history" onclick="showTab('history')">History</button>
  </div>
</div>

<div id="tab-watch"></div>
<div id="tab-swimmers" hidden></div>
<div id="tab-history" hidden></div>
<div id="toast" hidden></div>

<script>
// Everything lives in this one file and in the phone's own localStorage -
// no server, no network. All names are inserted as text nodes (never as
// HTML), and swimmers are tracked by id, so duplicate or odd names are safe.
const KEY = 'swimstopwatch.v1';
const $ = id => document.getElementById(id);

function emptyState() {
  return { nextId: 1, swimmers: [], groups: [], sessions: [], activeSessionId: null,
           deck: [],       // swimmer ids currently shown on the Stopwatch tab, in order
           running: {},    // swimmer id -> { start, marks } of the swim being timed
           selected: [] }; // swimmer ids ticked on the Stopwatch tab for "Start selected"
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.swimmers)) return migrate(Object.assign(emptyState(), s));
  } catch (e) {}
  return emptyState();
}

// Data model. A *swim* is one measurement from Start to Stop (e.g. a whole
// 2000 m). Each Split tap inside it stores a timestamp in `marks`, cutting
// the swim into *splits* (e.g. every 100 m); the last split ends at Stop.
//   state.running[id] = { start, marks: [t, ...] }
//   session.swims     = [{ swimmerId, name, start, marks: [t, ...], end }]
const splitTimes = sw => [...sw.marks, sw.end].map((t, i, a) => t - (i ? a[i - 1] : sw.start));

// Older versions stored a bare start time per running swimmer and a flat
// list of laps per session; convert both to the swim model.
function migrate(s) {
  for (const id in s.running) {
    if (typeof s.running[id] === 'number') s.running[id] = { start: s.running[id], marks: [] };
  }
  for (const ses of s.sessions) {
    if (!ses.swims) {
      ses.swims = (ses.laps || []).map(l => ({ swimmerId: l.swimmerId, name: l.name, start: l.at - l.ms, marks: [], end: l.at }));
    }
    delete ses.laps;
  }
  return s;
}

// Starter roster for a phone that has never used the app. Runs once only
// (the `seeded` flag), so deleting these swimmers later doesn't bring them back.
const SEED_NAMES = ['Matej', 'Ema', 'Lucas', 'Benjamin', 'Branimir', 'Josipa'];

function seedIfNew(s) {
  if (s.seeded) return s;
  s.seeded = true;
  if (s.swimmers.length || s.groups.length || s.sessions.length) return s;
  s.swimmers = SEED_NAMES.map(name => ({ id: s.nextId++, name }));
  const ids = s.swimmers.map(sw => sw.id);
  s.groups = [{ id: s.nextId++, name: 'All', swimmerIds: ids.slice() }];
  s.deck = ids;
  return s;
}

let state = seedIfNew(loadState());
let currentTab = 'watch';
let openSessionId = null;
let swimmerSearch = '';
let groupSearch = '';

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Could not save - phone storage is full or blocked.'); }
}

// ---- helpers ----
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el[k] = v;
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : String(kid));
  }
  return el;
}

const pad = n => String(n).padStart(2, '0');

function fmt(ms) {
  const cs = Math.max(0, Math.round(ms / 10));
  return `${Math.floor(cs / 6000)}:${pad(Math.floor(cs / 100) % 60)}.${pad(cs % 100)}`;
}

function timestampName(d = new Date()) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.hidden = true, 2500);
}

const swimmerById = id => state.swimmers.find(s => s.id === id);
const activeSession = () => state.sessions.find(s => s.id === state.activeSessionId);

// On phones, hand the file to the share sheet (save to Files, AirDrop, mail);
// elsewhere fall back to a normal download.
function download(filename, text, type) {
  const file = new File([text], filename, { type });
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).catch(() => {});
    return;
  }
  const a = h('a', { href: URL.createObjectURL(file), download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function showTab(name) {
  currentTab = name;
  menuOpen = false;
  for (const t of ['watch', 'swimmers', 'history']) {
    $('tab-' + t).hidden = t !== name;
    $('tabbtn-' + t).classList.toggle('active', t === name);
  }
  render();
}

// ---- menu (the three-line button in the header) - holds the session controls ----
let menuOpen = false;

function toggleMenu() {
  menuOpen = !menuOpen;
  renderMenu();
}

function renderMenu() {
  const s = activeSession();
  $('sessionBadge').textContent = s ? s.name : '';
  $('menuBtn').classList.toggle('open', menuOpen);
  const menu = $('menu');
  menu.hidden = !menuOpen;
  menu.replaceChildren();
  if (!menuOpen) return;
  menu.append(h('div', { class: 'card flex' },
    h('div', { class: 'grow' },
      h('div', { class: 'label' }, 'Session'),
      h('div', { class: 'strong' }, s ? s.name : 'None - one starts on the first tap')),
    h('button', { class: 'secondary small', onclick: newSession }, 'New'),
    s && h('button', { class: 'secondary small', onclick: endSession }, 'End')));
}

function render() {
  renderMenu();
  if (currentTab === 'watch') renderWatch();
  else if (currentTab === 'swimmers') renderSwimmers();
  else renderHistory();
  syncWakeLock();
}

// ---- sessions ----
function createSession(name) {
  const s = { id: state.nextId++, name, startedAt: Date.now(), swims: [] };
  state.sessions.push(s);
  state.activeSessionId = s.id;
  return s;
}

// Timers running at the moment a session changes would otherwise be logged
// into the wrong session, so they're dropped (after asking).
function okToDropRunning() {
  const n = Object.keys(state.running).length;
  if (n === 0) return true;
  if (!confirm(`${n} timer${n === 1 ? ' is' : 's are'} still running and will be discarded. Continue?`)) return false;
  state.running = {};
  return true;
}

function newSession() {
  const name = prompt('Session name', timestampName());
  if (name === null) return;
  if (!okToDropRunning()) return;
  createSession(name.trim() || timestampName());
  menuOpen = false;
  save();
  render();
}

function endSession() {
  if (!okToDropRunning()) return;
  state.activeSessionId = null;
  menuOpen = false;
  save();
  render();
}

// ---- stopwatch ----
// A swim is never thrown away for lack of a session: one is created on demand.
function endSwim(id, now) {
  const run = state.running[id];
  const sw = swimmerById(id);
  delete state.running[id];
  if (!run || !sw) return;
  const s = activeSession() || createSession(timestampName());
  s.swims.push({ swimmerId: id, name: sw.name, start: run.start, marks: run.marks, end: now });
}

// Tap feedback. The row is rebuilt on every tap, so a pressed look alone
// would vanish instantly; instead the next render flashes the button that
// was hit (`kind` is 'main' for Start/Stop or 'split'), plus a short buzz
// on phones that support vibration.
let flash = null;
function feedback(kind, ids) {
  flash = { kind, ids };
  if (navigator.vibrate) navigator.vibrate(15);
}

// Button 1: starts a swim, or stops it (which also closes its last split).
function startStop(id) {
  const now = Date.now();
  if (state.running[id]) endSwim(id, now);
  else state.running[id] = { start: now, marks: [] };
  feedback('main', [id]);
  save();
  render();
}

// Button 2: marks a split inside the running swim; the swim keeps timing.
function split(id) {
  const run = state.running[id];
  if (!run) return;
  run.marks.push(Date.now());
  feedback('split', [id]);
  save();
  render();
}

function startAll() {
  const now = Date.now();
  const started = state.deck.filter(id => !state.running[id]);
  for (const id of started) state.running[id] = { start: now, marks: [] };
  feedback('main', started);
  save();
  render();
}

// Starts only the ticked swimmers, all at the same instant. Ticks are cleared
// afterwards so the next wave can be ticked while this one is swimming.
function startSelected() {
  if (state.selected.length === 0) { toast('Tick the swimmers to start first.'); return; }
  const now = Date.now();
  const started = state.selected.filter(id => !state.running[id]);
  for (const id of started) state.running[id] = { start: now, marks: [] };
  feedback('main', started);
  state.selected = [];
  save();
  render();
}

function toggleSelected(id, on) {
  state.selected = state.selected.filter(x => x !== id);
  if (on) state.selected.push(id);
  save();
  render();
}

function stopAll() {
  const now = Date.now();
  const stopped = state.deck.filter(id => state.running[id]);
  for (const id of stopped) endSwim(id, now);
  feedback('main', stopped);
  save();
  render();
}

function setDeck(ids) {
  state.deck = ids.filter(id => swimmerById(id));
  for (const id of Object.keys(state.running)) {
    if (!state.deck.includes(+id)) delete state.running[id];
  }
}

function applyGroup(groupId) {
  const g = state.groups.find(g => g.id === groupId);
  if (!g) return;
  const dropped = Object.keys(state.running).filter(id => !g.swimmerIds.includes(+id)).length;
  if (dropped && !confirm(`${dropped} running timer${dropped === 1 ? '' : 's'} for swimmers outside this group will be discarded. Continue?`)) return;
  setDeck(g.swimmerIds.slice());
  save();
  showTab('watch');
}

// True when the Stopwatch list is exactly this group's swimmers - its button
// stays highlighted so it's clear which group is loaded.
function isLoaded(g) {
  const ids = g.swimmerIds.filter(id => swimmerById(id));
  return ids.length > 0 && ids.length === state.deck.length && ids.every(id => state.deck.includes(id));
}

function renderWatch() {
  const root = $('tab-watch');
  root.replaceChildren();
  const s = activeSession();

  const shownGroups = state.groups.filter(g => !g.hidden);
  if (shownGroups.length) {
    root.append(h('div', { class: 'chips' },
      shownGroups.map(g => h('button', { class: 'chip' + (isLoaded(g) ? ' active' : ''), onclick: () => applyGroup(g.id) }, g.name))));
  }

  if (state.deck.length === 0) {
    root.append(h('div', { class: 'card' },
      h('div', { class: 'sub' }, state.swimmers.length
        ? 'No swimmers selected. Pick a group above, or tick swimmers on the Swimmers tab.'
        : 'Add your swimmers first, then tick the ones you want to time.'),
      h('button', { onclick: () => showTab('swimmers') }, 'Go to Swimmers')));
    return;
  }

  state.selected = state.selected.filter(id => state.deck.includes(id));
  const nSel = state.selected.length;
  // Start/stop buttons live in a bar pinned to the bottom of the screen,
  // within thumb reach however long the swimmer list is.
  const bar = h('div', { class: 'bottombar' }, h('div', { class: 'btnrow' },
    h('button', { onclick: startAll }, 'Start all'),
    h('button', { style: nSel ? '' : 'opacity:0.5;', onclick: startSelected }, nSel ? `Start selected (${nSel})` : 'Start selected'),
    h('button', { class: 'secondary', onclick: stopAll }, 'Stop all')));

  const flashed = (kind, id) => flash && flash.kind === kind && flash.ids.includes(id) ? ' flash' : '';
  for (const id of state.deck) {
    const sw = swimmerById(id);
    if (!sw) continue;
    const run = state.running[id];
    const swims = s ? s.swims.filter(x => x.swimmerId === id) : [];
    let info, time = null;
    if (run) {
      // big number = whole swim so far; small line = which split is in
      // progress and how long the previous one took
      const marks = run.marks;
      const splitStart = marks.length ? marks[marks.length - 1] : run.start;
      const prev = marks.length ? ` · prev ${fmt(splitStart - (marks.length > 1 ? marks[marks.length - 2] : run.start))}` : '';
      info = h('div', { class: 'label' }, `Split ${marks.length + 1}${prev}`);
      time = h('div', { class: 'time' }, fmt(Date.now() - run.start));
      time.dataset.run = run.start;
    } else {
      const last = swims[swims.length - 1];
      info = h('div', { class: 'label' }, last
        ? `${swims.length} swim${swims.length === 1 ? '' : 's'} · last ${fmt(last.end - last.start)}`
        : 'Not started');
    }
    root.append(h('div', { class: 'card lap' + (run ? ' running' : '') },
      h('div', { class: 'flex' },
        h('label', { class: 'tick' },
          h('input', { type: 'checkbox', checked: state.selected.includes(id), onchange: e => toggleSelected(id, e.target.checked) })),
        h('div', { class: 'grow' },
          h('div', { class: 'strong' }, sw.name),
          info),
        time),
      h('div', { class: 'swimbtns' },
        h('button', { class: (run ? 'danger' : '') + flashed('main', id), onclick: () => startStop(id) }, run ? 'Stop' : 'Start'),
        h('button', { class: 'secondary' + flashed('split', id), disabled: !run, onclick: () => split(id) }, 'Split'))));
  }
  flash = null;
  root.append(h('div', { class: 'sub' }, 'Start begins a swim and Stop ends it. Split marks a split (for example every 100 m) while the swim keeps timing. Tick swimmers and use Start selected to start just those together.'));
  root.append(bar);
}

// Running times are derived from the stored start timestamp, so they stay
// correct across a reload, a locked screen, or the browser pausing this timer.
setInterval(() => {
  const now = Date.now();
  for (const el of document.querySelectorAll('[data-run]')) el.textContent = fmt(now - el.dataset.run);
}, 50);

// ---- swimmers & groups ----
function addSwimmer() {
  const name = $('newName').value.trim();
  if (!name) { toast('Enter a name first.'); return; }
  const sw = { id: state.nextId++, name };
  state.swimmers.push(sw);
  state.deck.push(sw.id);
  save();
  render();
  $('newName').focus();
}

function renameSwimmer(sw) {
  const name = prompt('Swimmer name', sw.name);
  if (name === null || !name.trim()) return;
  sw.name = name.trim();
  save();
  render();
}

function deleteSwimmer(sw) {
  if (!confirm(`Delete ${sw.name}? Laps already logged stay in History.`)) return;
  state.swimmers = state.swimmers.filter(x => x.id !== sw.id);
  state.deck = state.deck.filter(id => id !== sw.id);
  delete state.running[sw.id];
  for (const g of state.groups) g.swimmerIds = g.swimmerIds.filter(id => id !== sw.id);
  save();
  render();
}

function toggleDeck(id, on) {
  if (on && !state.deck.includes(id)) state.deck.push(id);
  if (!on) {
    state.deck = state.deck.filter(x => x !== id);
    delete state.running[id];
  }
  save();
}

function saveGroup() {
  const name = $('newGroupName').value.trim();
  if (!name) { toast('Enter a group name first.'); return; }
  if (state.deck.length === 0) { toast('Tick at least one swimmer first.'); return; }
  state.groups.push({ id: state.nextId++, name, swimmerIds: state.deck.slice() });
  save();
  render();
}

function deleteGroup(g) {
  if (!confirm(`Delete group ${g.name}? The swimmers themselves are kept.`)) return;
  state.groups = state.groups.filter(x => x.id !== g.id);
  save();
  render();
}

function renderSwimmerList() {
  const list = $('swimmerList');
  list.replaceChildren();
  const q = swimmerSearch.toLowerCase();
  for (const sw of state.swimmers) {
    if (!sw.name.toLowerCase().includes(q)) continue;
    list.append(h('div', { class: 'card flex' },
      h('input', { type: 'checkbox', checked: state.deck.includes(sw.id), onchange: e => toggleDeck(sw.id, e.target.checked) }),
      h('div', { class: 'grow strong', onclick: () => renameSwimmer(sw) }, sw.name),
      h('button', { class: 'x', onclick: () => deleteSwimmer(sw) }, '×')));
  }
  if (!list.children.length) {
    list.append(h('div', { class: 'sub' }, state.swimmers.length ? 'No swimmer matches the search.' : 'No swimmers yet.'));
  }
}

// Group cards vary in height (member names can wrap), so the 4-row limit is
// measured from the rendered cards instead of being a fixed CSS height.
const GROUPS_VISIBLE = 4;

function renderGroupList() {
  const list = $('groupList');
  list.replaceChildren();
  const q = groupSearch.toLowerCase();
  for (const g of state.groups) {
    const members = g.swimmerIds.map(id => (swimmerById(id) || {}).name).filter(Boolean).join(', ');
    if (!(g.name + ' ' + members).toLowerCase().includes(q)) continue;
    list.append(h('div', { class: 'card' },
      h('div', { class: 'flex' },
        h('div', { class: 'grow strong' }, g.name),
        h('button', { class: 'x', onclick: () => deleteGroup(g) }, '×')),
      h('div', { class: 'label' }, members || '(empty)'),
      h('label', { class: 'flex label', style: 'margin-top:10px;' },
        h('input', { type: 'checkbox', checked: !g.hidden, onchange: e => { g.hidden = !e.target.checked; save(); } }),
        'Show on Stopwatch tab')));
  }
  if (!list.children.length) {
    list.append(h('div', { class: 'sub' }, state.groups.length ? 'No group matches the search.' : 'No groups yet.'));
  }
  const cards = list.children;
  list.style.maxHeight = cards.length > GROUPS_VISIBLE
    ? (cards[GROUPS_VISIBLE - 1].offsetTop + cards[GROUPS_VISIBLE - 1].offsetHeight - cards[0].offsetTop) + 'px'
    : '';
}

function renderSwimmers() {
  const root = $('tab-swimmers');
  root.replaceChildren();

  root.append(
    h('div', { class: 'sub' }, 'Ticked swimmers appear on the Stopwatch tab. Tap a name to rename it.'),
    h('input', { type: 'text', placeholder: 'Search swimmers...', value: swimmerSearch, style: 'margin-bottom:12px;',
                 oninput: e => { swimmerSearch = e.target.value; renderSwimmerList(); } }),
    h('div', { id: 'swimmerList' }),
    h('button', { class: 'secondary', style: 'width:100%; margin-bottom:10px;', onclick: () => {
      const n = Object.keys(state.running).length;
      if (n && !confirm(`${n} running timer${n === 1 ? '' : 's'} will be discarded. Continue?`)) return;
      setDeck([]); save(); render();
    } }, 'Untick all'),
    h('div', { class: 'card flex' },
      h('input', { type: 'text', id: 'newName', placeholder: 'Swimmer name', onkeydown: e => { if (e.key === 'Enter') addSwimmer(); } }),
      h('button', { onclick: addSwimmer }, 'Add')),

    h('h2', null, 'Groups'),
    h('div', { class: 'sub' }, 'Tick swimmers above, name the group and save it - then load the whole group with one tap from the bar on the Stopwatch tab.'),
    h('input', { type: 'text', placeholder: 'Search groups...', value: groupSearch, style: 'margin-bottom:12px;',
                 oninput: e => { groupSearch = e.target.value; renderGroupList(); } }),
    h('div', { id: 'groupList' }),
    h('div', { class: 'card flex' },
      h('input', { type: 'text', id: 'newGroupName', placeholder: 'Group name, e.g. Team A' }),
      h('button', { onclick: saveGroup }, 'Save')));

  renderSwimmerList();
  renderGroupList();
}

// ---- history ----
const csvCell = v => /[",\n\r]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);

// One row per event - start, every split, stop - so the export holds
// everything that was tapped. `clock` is the phone's time of day.
function sessionCsv(s) {
  const sec = ms => (ms / 1000).toFixed(2);
  const clock = t => {
    const d = new Date(t);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(Math.floor(d.getMilliseconds() / 10))}`;
  };
  const rows = [['session', 'swimmer', 'swim', 'event', 'split', 'split_seconds', 'total_seconds', 'clock']];
  const counts = {};
  for (const sw of s.swims) {
    const n = counts[sw.swimmerId] = (counts[sw.swimmerId] || 0) + 1;
    const times = splitTimes(sw);
    rows.push([s.name, sw.name, n, 'start', '', '', sec(0), clock(sw.start)]);
    [...sw.marks, sw.end].forEach((t, i) => rows.push(
      [s.name, sw.name, n, i < sw.marks.length ? 'split' : 'stop', i + 1, sec(times[i]), sec(t - sw.start), clock(t)]));
  }
  return rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n';
}

const safeFilename = name => (name.replace(/[^A-Za-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'session');

function deleteSession(s) {
  if (!confirm(`Delete session ${s.name} and its ${s.swims.length} swim${s.swims.length === 1 ? '' : 's'}?`)) return;
  if (s.id === state.activeSessionId) {
    if (!okToDropRunning()) return;
    state.activeSessionId = null;
  }
  state.sessions = state.sessions.filter(x => x.id !== s.id);
  save();
  render();
}

function sessionDetail(s) {
  const box = h('div', { style: 'margin-top:12px;' });
  const bySwimmer = new Map();
  for (const sw of s.swims) {
    if (!bySwimmer.has(sw.swimmerId)) bySwimmer.set(sw.swimmerId, []);
    bySwimmer.get(sw.swimmerId).push(sw);
  }
  const change = fn => { fn(); save(); render(); };
  for (const swims of bySwimmer.values()) {
    box.append(h('div', { class: 'strong', style: 'margin:14px 0 2px;' }, swims[swims.length - 1].name));
    swims.forEach((sw, n) => {
      const times = splitTimes(sw);
      const max = Math.max(...times), best = Math.min(...times);
      box.append(h('div', { class: 'flex', style: 'gap:8px; margin-top:6px;' },
        h('div', { class: 'grow', style: 'font-size:13px;' }, `Swim ${n + 1} · total ${fmt(sw.end - sw.start)}`),
        h('button', { class: 'x', onclick: () => {
          if (confirm(`Delete swim ${n + 1} (${fmt(sw.end - sw.start)}) of ${sw.name}?`)) change(() => s.swims.splice(s.swims.indexOf(sw), 1));
        } }, '×')));
      if (times.length < 2) return;  // no splits were marked - the total says it all
      times.forEach((ms, i) => box.append(h('div', { class: 'flex', style: 'gap:8px; margin-bottom:4px;' },
        h('div', { class: 'label', style: 'width:48px; flex-shrink:0;' }, `Split ${i + 1}`),
        h('div', { class: 'bar' }, h('div', { class: ms === best ? 'best' : '', style: `width:${max > 0 ? Math.round(ms / max * 100) : 0}%` })),
        h('div', { style: 'width:64px; font-size:12px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums;' }, fmt(ms)),
        // Removing a split mark keeps the swim's total: its time joins the next split.
        i < sw.marks.length
          ? h('button', { class: 'x', onclick: () => {
              if (confirm(`Remove the mark after split ${i + 1}? Its ${fmt(ms)} is added to the next split.`)) change(() => sw.marks.splice(i, 1));
            } }, '×')
          : h('div', { style: 'width:30px; flex-shrink:0;' }))));
      const avg = times.reduce((a, b) => a + b, 0) / times.length;
      box.append(h('div', { class: 'label' }, `Avg split ${fmt(avg)} · Best ${fmt(best)} · ${times.length} splits`));
    });
  }
  if (!s.swims.length) box.append(h('div', { class: 'sub' }, 'No swims logged in this session.'));
  box.append(h('div', { class: 'btnrow', style: 'margin:14px 0 0;' },
    h('button', { class: 'secondary', onclick: () => download(safeFilename(s.name) + '.csv', sessionCsv(s), 'text/csv') }, 'Export CSV'),
    h('button', { class: 'danger', onclick: () => deleteSession(s) }, 'Delete')));
  return box;
}

function exportBackup() {
  const d = new Date();
  download(`swimstopwatch-backup-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`,
           JSON.stringify(state, null, 1), 'application/json');
}

async function importBackup(file) {
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.swimmers) || !Array.isArray(data.sessions)) { toast('That is not a SwimStopwatch backup file.'); return; }
  if (!confirm('Replace everything on this phone with the backup?')) return;
  state = migrate(Object.assign(emptyState(), data));
  save();
  render();
  toast('Backup restored.');
}

function renderHistory() {
  const root = $('tab-history');
  root.replaceChildren();
  if (!state.sessions.length) root.append(h('div', { class: 'sub' }, 'No sessions yet.'));

  for (const s of state.sessions.slice().reverse()) {
    const open = s.id === openSessionId;
    root.append(h('div', { class: 'card' },
      h('div', { class: 'flex', style: 'cursor:pointer;', onclick: () => { openSessionId = open ? null : s.id; render(); } },
        h('div', { class: 'grow' },
          h('div', { class: 'strong' }, s.name),
          h('div', { class: 'label' }, `${timestampName(new Date(s.startedAt))} · ${s.swims.length} swim${s.swims.length === 1 ? '' : 's'}` +
                                      (s.id === state.activeSessionId ? ' · active' : ''))),
        h('div', { class: 'label' }, open ? '▲' : '▼')),
      open && sessionDetail(s)));
  }

  const picker = h('input', { type: 'file', accept: '.json,application/json', hidden: true,
                              onchange: e => importBackup(e.target.files[0]) });
  root.append(
    h('h2', null, 'Backup'),
    h('div', { class: 'sub' }, 'All data is stored only on this phone, in this browser. Export a backup now and then - clearing browser data erases everything.'),
    h('div', { class: 'btnrow' },
      h('button', { class: 'secondary', onclick: exportBackup }, 'Export backup'),
      h('button', { class: 'secondary', onclick: () => picker.click() }, 'Import backup')),
    picker);
}

// ---- keep the screen on while timing (needs https; silently skipped otherwise) ----
let wakeLock = null;
async function syncWakeLock() {
  if (!('wakeLock' in navigator)) return;
  const want = Object.keys(state.running).length > 0 && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release();
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });

// Offline support and protection against storage eviction - both only exist
// when the page is served over https (or localhost), not from a local file.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// iOS Safari only applies :active (the pressed look) once a touch listener exists.
document.addEventListener('touchstart', () => {}, { passive: true });

showTab('watch');
</script>
</body>
